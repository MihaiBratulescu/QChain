name: Nuget PCompose

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/PCompose/PCompose.csproj

      - name: Build
        run: dotnet build src/PCompose/PCompose.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/PCompose/PCompose.csproj --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.PCOMPOSE_NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
